name: hansl
description: "HANSL 근태 관리 시스템 - 출근, 연차 신청, 승인 관리를 위한 업무용 애플리케이션"

publish_to: 'none' 

version: 1.0.1+3

environment:
  sdk: ^3.8.0


dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.3
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  geolocator: ^10.1.0
  provider: ^6.1.2
  table_calendar: ^3.2.0
  dropdown_button2: ^2.3.9
  keyboard_actions: ^4.2.0
  flutter_dotenv: ^5.1.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  package_info_plus: ^4.2.0
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.otf
        - asset: assets/fonts/NotoSans-Bold.otf

# App Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon_1024.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true # 앱스토어 심사를 위해 iOS 아이콘에서 알파 채널 제거
  web:
    generate: true
    image_path: "assets/icons/icon_1024.png"
    background_color: "#1777CB"
    theme_color: "#1777CB"
  windows:
    generate: true
    image_path: "assets/icons/icon_1024.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/icon_1024.png"
