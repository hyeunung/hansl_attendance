name: hansl
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.0


dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.3
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  geolocator: ^10.1.0
  provider: ^6.1.2
  table_calendar: ^3.2.0
  dropdown_button2: ^2.3.9
  keyboard_actions: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.otf
        - asset: assets/fonts/NotoSans-Bold.otf
