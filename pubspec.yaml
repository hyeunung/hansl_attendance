name: hansl
description: "HANSL - 회사, 팀, 조직 누구나 사용할 수 있는 출퇴근 관리앱"

publish_to: 'none' 

version: 1.2.5+1

environment:
  sdk: ^3.8.0


dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.3
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  geolocator: ^10.1.0
  provider: ^6.1.2
  table_calendar: ^3.2.0
  dropdown_button2: ^2.3.9
  flutter_dotenv: ^5.1.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  package_info_plus: ^8.3.0
  http: ^1.1.0
  flutter_secure_storage: ^9.0.0
  flutter_pdfview: ^1.3.2
  intl: ^0.20.0
  path_provider: ^2.1.4
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  mockito: ^5.4.4
  build_runner: ^2.4.9
  test: ^1.25.2

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.otf
          weight: 400
        - asset: assets/fonts/NotoSans-Medium.otf  
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.otf
          weight: 700
        - asset: assets/fonts/NotoSans-Black.otf
          weight: 800

# App Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon_1024.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true # 앱스토어 심사를 위해 iOS 아이콘에서 알파 채널 제거
  web:
    generate: true
    image_path: "assets/icons/icon_1024.png"
    background_color: "#1777CB"
    theme_color: "#1777CB"
  windows:
    generate: true
    image_path: "assets/icons/icon_1024.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/icon_1024.png"

# Native Splash Screen Configuration
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  
  # 배경색만 사용 (텍스트는 Flutter SplashScreen에서 처리)
  android: true
  ios: true
  web: true
  
  # SplashScreen 위젯으로 넘어가는 시간을 최소화
  android_12:
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
